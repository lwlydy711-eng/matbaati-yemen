<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مطبـعتي</title>

<style>
*{
  box-sizing:border-box;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  margin:0;
  background:#f3f5f7;
  color:#17212b;
}

header{
  background:#17212b;
  color:white;
  text-align:center;
  padding:28px 20px;
  border-radius:0 0 28px 28px;
}

.logo{
  font-size:42px;
}

header h1{
  margin:5px 0;
  font-size:30px;
}

header p{
  margin:8px 0 0;
  color:#cbd5df;
}

.container{
  max-width:650px;
  margin:auto;
  padding:22px;
}

.card{
  background:white;
  border-radius:22px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.card h2{
  margin-top:0;
}

.role{
  width:100%;
  padding:22px;
  margin:10px 0;
  border:0;
  border-radius:18px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
  text-align:right;
}

.print-role{
  background:#17212b;
  color:white;
}

.send-role{
  background:#e8edf1;
  color:#17212b;
}

.hidden{
  display:none;
}

.back{
  background:#e8edf1;
  color:#17212b;
  border:0;
  padding:12px 18px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:15px;
}

input[type="text"]{
  width:100%;
  padding:15px;
  border:1px solid #d5dce2;
  border-radius:13px;
  font-size:16px;
  margin-bottom:14px;
}

.file-box{
  display:block;
  border:2px dashed #8b98a5;
  border-radius:18px;
  padding:30px 15px;
  text-align:center;
  cursor:pointer;
  background:#fafbfc;
}

.file-box input{
  display:none;
}

.file-icon{
  font-size:42px;
}

.file-name{
  margin-top:12px;
  color:#52606d;
}

button{
  cursor:pointer;
}

.main-button{
  width:100%;
  padding:16px;
  margin-top:15px;
  border:0;
  border-radius:14px;
  background:#17212b;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.status{
  margin-top:15px;
  padding:14px;
  border-radius:13px;
  background:#f0f3f5;
  text-align:center;
  color:#52606d;
}

.empty{
  text-align:center;
  padding:25px;
  color:#7b8794;
}

.file-item{
  background:#f5f7f9;
  padding:16px;
  border-radius:15px;
  margin-bottom:10px;
}

.file-item strong{
  display:block;
  margin-bottom:7px;
}

.small{
  color:#687582;
  font-size:14px;
  line-height:1.8;
}

footer{
  text-align:center;
  padding:20px;
  color:#89939d;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">🖨️</div>
  <h1>مطبـعتي</h1>
  <p>نقل الملفات للطباعة بسهولة</p>
</header>

<div class="container">

  <!-- الصفحة الرئيسية -->
  <section id="home" class="card">

    <h2>كيف تريد استخدام مطبعتي؟</h2>

    <button class="role print-role" onclick="openPrinter()">
      🖨️ أنا مسؤول الطباعة
      <div class="small" style="color:#d8e0e6">
        استقبال الملفات وتجهيزها للطباعة
      </div>
    </button>

    <button class="role send-role" onclick="openSender()">
      📤 أنا أريد إرسال ملف
      <div class="small">
        إرسال ملف إلى مسؤول الطباعة
      </div>
    </button>

  </section>


  <!-- قسم مسؤول الطباعة -->
  <section id="printer" class="hidden">

    <div class="card">

      <button class="back" onclick="goHome()">
        ← رجوع
      </button>

      <h2>🖨️ مسؤول الطباعة</h2>

      <p class="small">
        هذه الصفحة مخصصة للشخص المسؤول عن استقبال الملفات
        وتجهيزها للطباعة.
      </p>

      <div class="status">
        🟢 جهاز الطباعة جاهز
      </div>

    </div>

    <div class="card">

      <h2>📥 الملفات المستلمة</h2>

      <div id="receivedFiles">
        <div class="empty">
          لا توجد ملفات مستلمة حتى الآن.
        </div>
      </div>

    </div>

  </section>


  <!-- قسم إرسال ملف -->
  <section id="sender" class="hidden">

    <div class="card">

      <button class="back" onclick="goHome()">
        ← رجوع
      </button>

      <h2>📤 إرسال ملف</h2>

      <input
        type="text"
        id="employeeName"
        placeholder="اكتب اسم الموظف"
      >

      <label class="file-box">

        <div class="file-icon">📁</div>

        <strong>
          اضغط لاختيار الملف
        </strong>

        <div class="small">
          PDF أو Word أو Excel أو صورة وغيرها
        </div>

        <input
          type="file"
          id="fileInput"
          onchange="selectFile()"
        >

        <div class="file-name" id="fileName">
          لم يتم اختيار ملف
        </div>

      </label>

      <button
        class="main-button"
        onclick="prepareSend()"
      >
        📤 إرسال الملف
      </button>

      <div class="status" id="sendStatus">
        جاهز لإرسال ملف
      </div>

    </div>

  </section>

</div>

<footer>
  مطبـعتي © 2026
</footer>


<script>

let selectedFile = null;


/* الانتقال إلى الصفحة الرئيسية */

function goHome(){

  document.getElementById("home").classList.remove("hidden");

  document.getElementById("printer").classList.add("hidden");

  document.getElementById("sender").classList.add("hidden");

}


/* فتح قسم مسؤول الطباعة */

function openPrinter(){

  document.getElementById("home").classList.add("hidden");

  document.getElementById("printer").classList.remove("hidden");

  document.getElementById("sender").classList.add("hidden");

  loadFiles();

}


/* فتح قسم إرسال الملف */

function openSender(){

  document.getElementById("home").classList.add("hidden");

  document.getElementById("printer").classList.add("hidden");

  document.getElementById("sender").classList.remove("hidden");

}


/* اختيار الملف */

function selectFile(){

  const input =
    document.getElementById("fileInput");

  const name =
    document.getElementById("fileName");

  if(input.files.length > 0){

    selectedFile = input.files[0];

    name.textContent =
      selectedFile.name +
      " • " +
      formatSize(selectedFile.size);

  }else{

    selectedFile = null;

    name.textContent =
      "لم يتم اختيار ملف";

  }

}


/* تجهيز الإرسال */

function prepareSend(){

  const employee =
    document.getElementById("employeeName")
    .value
    .trim();

  const status =
    document.getElementById("sendStatus");


  if(!employee){

    status.textContent =
      "⚠️ اكتب اسم الموظف أولاً";

    return;
  }


  if(!selectedFile){

    status.textContent =
      "⚠️ اختر الملف أولاً";

    return;
  }


  /*
   * النسخة الحالية تحفظ معلومات الملف
   * على الجهاز للتجربة.
   *
   * في المرحلة التالية سنضيف
   * النقل الحقيقي بين الهواتف.
   */

  const fileInfo = {

    name:selectedFile.name,

    size:selectedFile.size,

    employee:employee,

    date:new Date().toLocaleString("ar-YE")

  };


  let files =
    JSON.parse(
      localStorage.getItem("matbaatiReceived")
      || "[]"
    );


  files.unshift(fileInfo);


  localStorage.setItem(
    "matbaatiReceived",
    JSON.stringify(files)
  );


  status.textContent =
    "✅ تم تجهيز الملف بنجاح";


  selectedFile = null;

  document.getElementById("fileInput").value = "";

  document.getElementById("fileName").textContent =
    "لم يتم اختيار ملف";

}


/* عرض الملفات */

function loadFiles(){

  const container =
    document.getElementById("receivedFiles");


  let files =
    JSON.parse(
      localStorage.getItem("matbaatiReceived")
      || "[]"
    );


  if(files.length === 0){

    container.innerHTML =
      '<div class="empty">لا توجد ملفات مستلمة حتى الآن.</div>';

    return;
  }


  container.innerHTML =
    files.map(function(file){

      return `

        <div class="file-item">

          <strong>
            📄 ${escapeHtml(file.name)}
          </strong>

          👤 الموظف:
          ${escapeHtml(file.employee)}

          <br>

          📦 الحجم:
          ${formatSize(file.size)}

          <br>

          🕒 ${escapeHtml(file.date)}

        </div>

      `;

    }).join("");

}


/* حجم الملف */

function formatSize(bytes){

  if(bytes < 1024){

    return bytes + " بايت";

  }

  if(bytes < 1024 * 1024){

    return (bytes / 1024).toFixed(1) + " كيلوبايت";

  }

  return (bytes / (1024 * 1024)).toFixed(1)
    + " ميجابايت";

}


/* حماية النص */

function escapeHtml(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


loadFiles();

</script>

</body>
</html>
